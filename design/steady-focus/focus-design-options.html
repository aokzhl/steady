function taskRow(ref,mini=false){const t=task(ref.id);if(!t||t.deleted)return'';const ch=children(t),d=done(t,ref.key),owner=state.session?.taskId===t.id&&state.session.key===ref.key;const pd=dueDate(t,ref.key),tagids=t.tags||[];const subtitle=[repeatFor(t)==='weekly'&&!pd?'На этой неделе':fmtDay(pd),!state.project&&projectId(t)?projectName(projectId(t)):null].filter(Boolean);return `<div class="taskrow ${t.parent?'child':''} ${d?'done':''} ${refSame(ref,state.selected)?'selected':''} ${ref.context?'context':''}" data-row="${t.id}" data-key="${E(ref.key)}"><button class="check ${d?'done':''}" data-action="complete" data-id="${t.id}" data-key="${E(ref.key)}" data-date="${ref.date}" aria-label="${d?'Вернуть':'Выполнить'}: ${E(t.title)}">${d?icon('check'):''}</button>${ch.length?`<button class="disclose ${state.expanded.has(t.id)?'open':''}" data-action="expand" data-id="${t.id}" aria-label="Подзадачи ${E(t.title)}" aria-expanded="${state.expanded.has(t.id)}">${icon('chevron')}</button>`:'<span class="disclose-spacer"></span>'}<button class="taskselect" data-action="select" data-id="${t.id}" data-key="${E(ref.key)}" data-date="${ref.date}"><span class="tasktitle"><span>${E(t.title)}</span>${owner?'<span class="ownerbadge"><span class="dot"></span>Сессия</span>':''}</span><span class="taskmeta">${subtitle.map(x=>`<span>${E(x)}</span>`).join('')}${tagids.slice(0,2).map(id=>`<span class="pill">${E(tagName(id))}</span>`).join('')}${tagids.length>2?`<span>+${tagids.length-2}</span>`:''}${ref.context&&d?'<span>Родитель выполнен · есть открытые подзадачи</span>':''}</span></button>${!mini?`<span class="taskmetric">${metricHTML(t,ref.key)}</span>`:''}<button class="play" data-action="start" data-id="${t.id}" data-key="${E(ref.key)}" data-date="${ref.date}" ${state.session?'disabled':''} title="${state.session?'Сначала заверши текущую сессию':'Начать фокус'}" aria-label="Начать фокус: ${E(t.title)}">${icon('play')}</button></div>`}

function cleanNote(html){const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,img,svg,video,audio').forEach(n=>n.remove());doc.body.querySelectorAll('*').forEach(n=>{if(!['B','STRONG','I','EM','U','MARK','UL','OL','LI','P','DIV','BR','A'].includes(n.tagName)){n.replaceWith(...n.childNodes);return}for(const a of [...n.attributes])if(n.tagName!=='A'||!['href','target','rel'].includes(a.name))n.removeAttribute(a.name);if(n.tagName==='A'){if(!/^https?:\/\//i.test(n.getAttribute('href')||''))n.removeAttribute('href');n.setAttribute('target','_blank');n.setAttribute('rel','noopener')}});return doc.body.innerHTML}

function calendarHTML(){const visibleCount=innerHeight<900?1:2;const first=dateObj(state.month+'-01'),offset=(first.getDay()+6)%7,start=addDays(localDate(first),-offset);const days=Array.from({length:42},(_,i)=>addDays(start,i)),allowed=datesForPeriod();const rows=tasks.filter(t=>!t.parent&&!t.deleted&&matchScope(t));const included=d=>state.period==='all'||(state.period==='done')||allowed.includes(d);return `<div class="calendar-wrap" id="calendar-scroll"><div class="monthnav"><strong>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</strong><button class="iconbtn" data-month="-1" aria-label="Предыдущий месяц">${icon('back')}</button><button class="btn quiet" data-action="calendar-today">Сегодня</button><button class="iconbtn" data-month="1" aria-label="Следующий месяц">${icon('chevron')}</button></div><div class="monthgrid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(n=>`<div class="weekday">${n}</div>`).join('')}${days.map(d=>{const refs=included(d)?rows.filter(t=>occursOn(t,d)).map(t=>refOnDate(t,d)).filter(r=>state.period==='done'?done(task(r.id),r.key):!done(task(r.id),r.key)||state.showDone):[];return `<div class="daycell ${d.slice(0,7)!==state.month?'outside':''} ${d===TODAY?'today':''} ${state.chosenDay===d?'selected-day':''}" data-drop-date="${d}"><div class="dayhead"><button class="daynum" data-action="day-list" data-date="${d}" aria-label="Задачи на ${fmtDay(d,true)}">${dateObj(d).getDate()}</button><button class="dayadd" data-action="create" data-date="${d}" aria-label="Создать на ${fmtDay(d,true)}">+</button></div>${refs.slice(0,visibleCount).map(r=>`<button draggable="true" class="cal-task ${done(task(r.id),r.key)?'done':''}" data-drag-id="${r.id}" data-key="${r.key}" data-date="${d}" data-action="select" data-id="${r.id}">${E(task(r.id).title)}</button>`).join('')}${refs.length>visibleCount?`<button class="cal-more" data-action="day-list" data-date="${d}">Ещё ${refs.length-visibleCount}</button>`:''}</div>`}).join('')}</div><div class= function createHTML(){const d=state.draft;return `<label class="field">Название · обязательно<input id="new-title" name="title" value="${E(d.title)}" placeholder="Что нужно сделать?" maxlength="180" autocomplete="off"></label><p class="error" id="title-error" hidden>Введи название задачи.</p><div class="grid2"><label class="field">День<input type="date" name="day" value="${d.day}"></label><label class="field">Проект<select name="project">${projectOptions(d.project)}</select></label></div><details class="advanced" ${d.advanced?'open':''}><summary>Повторение, метки и подзадачи</summary><label class="field">Повторение<select name="repeat">${repeatOptions(d.repeat)}</select></label>${dayChecks(d.days)}<label class="field">Интервал, дней · для «Каждые N дней»<input type="number" name="every" min="1" max="365" value="${d.every}"></label><p class="editor-help">Повтор создаёт новое выполнение без долгов. «Раз в неделю» не требует фиксированного дня.</p><label class="field">Метки</label>${tagButtons(d.tags,'draft-tag')}<label class="field">Заметка<textarea name="note" rows="3" placeholder="Необязательно">${E(d.note)}</textarea></label><label class="checkline"><input type="checkbox" name="custom" ${d.custom?'checked':''}>Свои параметры помодоро</label>${cfgFields(d.config)}<p class="editor-help">Без переопределения: 25 / 5 / 15 минут, длинный после 4.</p><div class="divider"></div><h3>Подзадачи</h3>${d.children.map((c,i)=>`<section class="child-draft" data-child="${i}"><div class="row"><input data-child-field="title" data-index="${i}" value="${E(c.title)}" aria-label="Название подзадачи ${i+1}" placeholder="Название подзадачи"><button class="iconbtn" data-action="remove-draft-child" data-index="${i}" aria-label="Убрать подзадачу">×</button></div><details><summary>Заметка, метки, параметры</summary><label class="field">Собственная заметка<textarea data-child-field="note" data-index="${i}" rows="2">${E(c.note)}</textarea></label><label class="field">Собственные метки<select data-child-field="tags" data-index="${i}" multiple size="4">${tags.map(t=>`<option value="${t.id}" ${(c.tags||[]).includes(t.id)?'selected':''}>${E(t.name)}</option>`).join('')}</select></label><label class="checkline"><input type="checkbox" data-child-field="custom" data-index="${i}" ${c.custom?'checked':''}>Свои параметры вместо родительских</label>${cfgFields(c.config||DEFAULT,'child-'+i+'-')}<p class="editor-help">Проект и повторение наследуются. Метки и заметка — собственные.</p></details></section>`).join('')}<button class="textbtn" data-action="add-draft-child">+ Добавить подзадачу</button></details>`}
function captureDraft(){if(state.editor?.kind!=='create'||!state.draft)return;const el=$('#editor-dialog'),d=state.draft;for(const n of ['title','day','repeat','note','goalUnit','goalTarget','project','every']){const node=$(`[name="${n}"]`,el);if(node)d[n]=node.value}d.days=$$('[name=repeat-day]:checked',el).map(n=>Number(n.value));d.custom=!!$('[name=custom]',el)?.checked;d.config=cfgFrom(el);d.advanced=!!$('.advanced',el)?.open;$$('[data-child-field]',el).forEach(node=>{const c=d.children[Number(node.dataset.index)];if(!c)return;const k=node.dataset.childField;c[k]=k==='custom'?node.checked:k==='tags'?[...node.selectedOptions].map(o=>Number(o.value)):node.value;});d.children.forEach((c,i)=>c.config=cfgFrom(el,'child-'+i+'-'))}
function openEditor(kind,extra={}){state.more=null;state.editor={kind,...extra};if(kind==='create'&&!state.draft)state.draft=defaultDraft();renderEditor();const dlg=$('#editor-dialog');if(!dlg.open)dlg.showModal();requestAnimationFrame(()=>($('#new-title')||$('input:not([type=checkbox]),select,button',dlg))?.focus())}
function closeEditor(force=false){captureDraft();if(!force&&state.editor?.kind==='create'&&(state.draft.title.trim()||state.draft.note.trim()||state.draft.children.length)){state.editor={kind:'discard'};renderEditor();return}$('#editor-dialog').close();state.editor=null;state.draft=null;requestAnimationFrame(()=>($('#detail-title')||$('[data-action=create]'))?.focus({preventScroll:true}))}
function renderEditor(){const el=$('#editor-dialog'),ed=state.editor,t=selectedTask(),r=state.selected;el.classList.toggle('create-dialog',ed.kind==='create');let title='',body='',buttons='';const save=(label='Сохранить')=>`<button class="btn primary" data-action="editor-save">${label}</button>`;switch(ed.kind){case'create':title='Новая задача';body=createHTML();buttons=`<span class="grow">Обязательно только название.<br>Все параметры доступны до создания.</span>${save('Создать')}`;break;case'discard':title='Сохранить черновик?';body='<p class="muted">Введённое ещё не добавлено в список.</p>';buttons='<button class="btn quiet" data-action="discard-draft">Не сохранять</button><button class="btn secondary" data-action="return-draft">Продолжить редактирование</button><button class="btn primary" data-action="save-draft-now">Создать</button>';break;case'pomo':title='Помодоро задачи';body=`<p class="editor-help">Текущая сессия не изменится. Параметры применятся при следующем запуске.</p><label class="field">Источник<select id="pomo-source"><option value="default" ${!t.config&&!t.parent?'selected':''}>Стандарт · 25 / 5 / 15 · после 4</option>${t.parent?`<option value="inherit" ${!t.config?'selected':''}>Как у родителя</option>`:''}${state.profiles.map(p=>`<option value="profile-${p.id}">${E(p.name)}</option>`).join('')}<option value="custom" ${t.config?'selected':''}>Свои настройки</option></select></label><div id="pomo-config">${cfgFields(configFor(t))}</div>`;buttons=save();break;case'day':title='День выполнения';body=`<label class="field">Плановый день<input id="edit-day" type="date" value="${dueDate(t,r.key)||''}"></label><p class="editor-help">${repeatFor(t)==='none'?'План не меняет фактическую историю.':'Изменится только выбранное выполнение, не вся серия.'}</p><button class="textbtn" data-action="clear-day">Без даты / день не выбран</button>`;buttons=save('Перенести');break;case'task-project':title='Проект задачи';body=`<label class="field">Проект<select id="edit-project" ${t.parent?'disabled':''}>${projectOptions(projectId(t))}</select></label><p class="editor-help">${t.parent?'Проект наследуется от родителя. Измени его в родительской задаче.':'История переклассифицируется, фактические даты и минуты сохраняются.'}</p>`;buttons=save();break;case'repeat':title='Повторение';body=`<label class="field">Частота<select id="edit-repeat" ${t.parent?'disabled':''}>${repeatOptions(repeatFor(t))}</select></label>${dayChecks(parent(t).days||[1,3,5])}<label class="field">Интервал, дней<input id="repeat-every" type="number" min="1" value="${parent(t).every||2}"></label><p class="editor-help">${t.parent?'Подзадача наследует повторение родителя.':'Изменение — для этого и будущих выполнений. Прошлые факты не переписываются. Для короткого месяца — последний существующий день.'}</p>`;buttons=save();break;case'goal-editor':title='Цель задачи';body=`<div class="grid2"><label class="field">Количество<input id="goal-target" type="number" min="1" value="${t.goal?.target||''}" placeholder="Необязательно"></label><label class="field">Единица<select id="goal-unit">${['мин','страниц','раз'].map(u=>`<option ${t.goal?.unit===u?'selected':''}>${u}</option>`).join('')}</select></label></div><p class="editor-help">Минутная цель получает только сохранённый прямой фокус. Цели детей не суммируются с родительской.</p>`;buttons='<button class="btn quiet" data-action="remove-goal">Убрать цель</button>'+save();break;case'task-tags':title='Метки задачи';ed.ids=ed.ids||[...(t.tags||[])];body=tagButtons(ed.ids)+`<p class="editor-help">Метки общие для всех повторов. У подзадачи свои метки.</p><div class="row"><input id="new-tag-name" placeholder="Новая метка" aria-label="Название метки" class="grow"><button class="btn secondary" data-action="create-tag">Добавить</button></div>`;buttons=save();break;case'filter-tags':title='Фильтр по меткам';ed.ids=ed.ids||[...state.tags];body=tagButtons(ed.ids)+`<label class="field">Условие<select id="tag-match"><option value="any" ${state.tagMatch==='any'?'selected':''}>Любая из выбранных</option><option value="all" ${state.tagMatch==='all'?'selected':''}>Все выбранные</option></select></label>`;buttons='<button class="btn quiet" data-action="clear-editor-tags">Сбросить</button>'+save('Применить');break;case'new-project':title='Новый проект';body='<label class="field">Название<input id="project-name" maxlength="60" placeholder="Например, Личное"></label>';buttons=save('Создать');break;case'project-options':title=projectName(state.project);body=`<label class="field">Название<input id="project-name" value="${E(projectName(state.project))}"></label><p class="editor-help">Проект — контейнер. У него нет собственного таймера или отметки выполнения.</p>`;buttons='<button class="btn quiet" data-action="archive-project">Архивировать</button>'+save();break;case'manage-tags':title='Общие метки';body=`${tags.map(q=>`<div class="row" style="margin-bottom:8px"><input data-rename-tag="${q.id}" value="${E(q.name)}" class="grow" aria-label="Название метки ${E(q.name)}"><button class="iconbtn danger" data-delete-tag="${q.id}" aria-label="Удалить метку ${E(q.name)}">×</button></div>`).join('')}<div class="row"><input id="new-tag-name" aria-label="Новая метка" placeholder="Новая метка" class="grow"><button class="btn secondary" data-action="create-tag">Добавить</button></div><p class="editor-help">Удаление убирает связь с задачами, сохраняя задачи и факты.</p>`;buttons=save('Готово');break;case'profile-edit':case'profile-new':{const p=state.profiles.find(q=>q.id===ed.id)||{name:'',...DEFAULT};title=ed.kind==='profile-new'?'Новый профиль':'Параметры профиля';body=`<label class="field">Название<input id="profile-name" value="${E(p.name)}"></label>${cfgFields(p)}<p class="editor-help">Применится к будущим запускам. Собственные настройки задач не изменятся.</p>`;buttons=save();break}case'free-editor':title='Фокус без задачи';body=`<label class="field">Профиль<select id="free-profile">${state.profiles.map(p=>`<option value="${p.id}">${E(p.name)} · ${p.focus} / ${p.short}</option>`).join('')}</select></label>${state.session?'<p class="lock-note">Сначала заверши текущую сессию.</p><button class="textbtn" data-action="current-close">К текущей задаче</button>':''}`;buttons=`<button class="btn primary" data-action="start-free-editor" ${state.session?'disabled':''}>Начать фокус</button>`;break;case'queue':title='Локальная очередь';body=`<p class="muted">${state.queue} результатов ждут отправки</p><p class="editor-help">${state.offline?'Сети нет. Можно продолжать локально.':'В прототипе отправка только демонстрационная.'} Настоящих запросов и постоянного хранения нет.</p>`;buttons=`<button class="btn secondary" data-action="toggle-offline">${state.offline?'Вернуть сеть':'Показать офлайн'}</button><button class="btn primary" data-action="retry-queue">Повторить отправку</button>`;break;case'account':title=state.loggedIn?'Демо-аккаунт':'Вход в Steady';body=state.loggedIn?'<p class="muted">Демо-вход выполнен. Реального аккаунта нет.</p>':`<p class="editor-help">Это визуальная форма. Не вводи настоящий пароль.</p><label class="field">Email<input type="email" id="demo-email" placeholder="demo@example.com"></label><label class="field">Демонстрационный пароль<input type="text" id="demo-password" placeholder="Любое демо-значение"></label><div class="row"><button class="textbtn" data-action="signup">Регистрация</button><button class="textbtn" data-action="recovery">Восстановить доступ</button></div>`;buttons=state.loggedIn?'<button class="btn secondary" data-action="signout">Выйти</button>':'<button class="btn primary" data-action="signin">Демо-вход</button>';break;case'import':title='Перенести гостевые данные?';body='<p class="muted">Задачи, профили и результаты остаются локально. В макете можно показать добровольный перенос.</p><label class="checkline"><input id="import-consent" type="checkbox">Перенести мои гостевые данные</label>';buttons='<button class="btn quiet" data-action="skip-import">Пропустить</button><button class="btn primary" data-action="confirm-import">Продолжить</button>';break;case'signup':title='Создать демо-аккаунт';body='<label class="field">Email<input type="email" placeholder="demo@example.com"></label><p class="editor-help">После регистрации требуется подтверждение email. Письма не отправляются.</p>';buttons='<button class="btn primary" data-action="verify-demo">Показать подтверждение email</button>';break;case'verify-demo':title='Подтверждение email';body='<p class="muted">В реальном приложении здесь ожидается подтверждение адреса. Макет работает без отправки письма.</p>';buttons='<button class="btn primary" data-action="signin">Подтвердить в демо</button>';break;case'recovery':title='Восстановить доступ';body='<label class="field">Email<input type="email" placeholder="demo@example.com"></label><p class="editor-help">Демонстрационный экран, без отправки писем.</p>';buttons='<button class="btn primary" data-action="recovery-done">Показать результат</button>';break;case'note-link':title='Ссылка в заметке';body='<label class="field">Текст<input id="link-text" placeholder="Название ссылки"></label><label class="field">Адрес<input id="link-url" type="url" placeholder="https://…"></label>';buttons=save('Вставить');break;case'archive-confirm':title='Архивировать проект?';body='<p class="muted">Задачи исчезнут из активного списка, факты останутся в отчёте. Будущие повторы не создадут долг.</p>';buttons='<button class="btn primary" data-action="confirm-archive">Архивировать</button>';break;default:title='Параметры';body='';}
el.innerHTML=`<div class="dialoghead"><h2 id="dialog-title">${E(title)}</h2><button class="iconbtn" data-action="close-editor" aria-label="Закрыть">${icon('close')}</button></div>${body}<footer class="dialogfoot"><button class="btn quiet" data-action="close-editor">${ed.kind==='discard'?'Вернуться':'Отмена'}</button>${buttons}</footer>`;}
function saveCreated(){captureDraft();const d=state.draft;if(!d?.title.trim()){if(state.editor.kind!=='create'){state.editor={kind:'create'};renderEditor()}$('#title-error').hidden=false;$('#new-title').setAttribute('aria-invalid','true');$('#new-title').focus();return}const id=state.nextId++,t={id,title:d.title.trim(),day:d.day||null,project:d.project?Number(d.project):null,repeat:d.repeat,days:d.days,every:Math.max(1,Number(d.every)||2),tags:[...d.tags],note:E(d.note).replace(/\n/g,'<br>'),config:d.custom?{...d.config}:null};if(Number(d.goalTarget)>0)t.goal={target:Number(d.goalTarget),unit:d.goalUnit};tasks.push(t);d.children.filter(c=>c.title?.trim()).forEach(c=>{const q={id:state.nextId++,parent:id,title:c.title.trim(),tags:[...(c.tags||[])],note:E(c.note||'').replace(/\n/g,'<br>'),config:c.custom?{...c.config}:null};if(Number(c.goalTarget)>0)q.goal={target:Number(c.goalTarget),unit:c.goalUnit};tasks.push(q)});const r=refFor(t,d.day||TODAY);state.expanded.add(id);closeEditor(true);state.period=state.period==='done'?'all':state.period;selectTask(r);notify('Задача создана · все данные в памяти')}
function saveEditor(){const ed=state.editor,t=selectedTask(),r=state.selected,el=$('#editor-dialog');if(!ed)return;if(ed.kind==='create'){saveCreated();return}if(ed.kind==='pomo'){const src=$('#pomo-source').value;t.config=src==='default'||src==='inherit'?null:cfgFrom(el)}else if(ed.kind==='day'){const date=$('#edit-day').value||null;moveOccurrence(t,r.key,date);r.date=date||TODAY;}else if(ed.kind==='task-project'){if(!t.parent)t.project=$('#edit-project').value?Number($('#edit-project').value):null;}else if(ed.kind==='repeat'){if(!t.parent){t.repeat=$('#edit-repeat').value;t.days=$$('[name=repeat-day]:checked',el).map(n=>Number(n.value));t.every=Math.max(1,Number($('#repeat-every').value)||2);state.selected=refFor(t,r.date)}}else if(ed.kind==='goal-editor'){const n=Number($('#goal-target').value);t.goal=n>0?{target:n,unit:$('#goal-unit').value}:null;checkGoal(t,r.key)}else if(ed.kind==='task-tags'){t.tags=[...ed.ids]}else if(ed.kind==='filter-tags'){state.tags=[...ed.ids];state.tagMatch=$('#tag-match').value;resetDetail()}else if(ed.kind==='new-project'){const name=$('#project-name').value.trim();if(!name){$('#project-name').focus();return}const p={id:Math.max(0,...projects.map(p=>p.id))+1,name,archived:false};projects.push(p);state.project=p.id;state.tags=[];resetDetail()}else if(ed.kind==='project-options'){const name=$('#project-name').value.trim();if(!name)return;projects.find(p=>p.id===state.project).name=name;}else if(ed.kind==='manage-tags'){$$('[data-rename-tag]',el).forEach(n=>{const tag=tags.find(t=>t.id===Number(n.dataset.renameTag));const v=n.value.trim();if(tag&&v&&!tags.some(t=>t.id!==tag.id&&t.name.toLocaleLowerCase()===v.toLocaleLowerCase()))tag.name=v})}else if(ed.kind==='profile-edit'||ed.kind==='profile-new'){const name=$('#profile-name').value.trim();if(!name){$('#profile-name').focus();return}const data={name,...cfgFrom(el)};if(ed.kind==='profile-edit')Object.assign(state.profiles.find(p=>p.id===ed.id),data);else state.profiles.push({id:Math.max(...state.profiles.map(p=>p.id))+1,...data})}else if(ed.kind==='note-link'){const href=$('#link-url').value.trim(),label=$('#link-text').value.trim()||href;if(!/^https?:\/\//i.test(href)){notify('Укажи адрес, начинающийся с https:// или http://');return}t.note=(t.note||'')+`<br><a href="${E(href)}" target="_blank" rel="noopener">${E(label)}</a>`}closeEditor(true);render();notify('Изменения сохранены в памяти')}
function moveOccurrence(t,key,date){const p=parent(t),old=repeatFor(t)==='none'?p.day:moves[p.id+':'+key];if(repeatFor(t)==='none')p.day=date;else moves[p.id+':'+key]=date;state.undo=()=>{if(repeatFor(t)==='none')p.day=old;else if(old===undefined)delete moves[p.id+':'+key];else moves[p.id+':'+key]=old;render()};notify(date?'План перенесён на '+fmtDay(date,true):'Плановый день убран','Отменить',()=>state.undo?.())}
function addQuantity(value){const t=selectedTask(),r=state.selected;if(!t?.goal||t.goal.unit==='мин')return;const o=occ(t,r.key),v=Math.max(0,Number(value)||0),delta=v-o.quantity;if(!delta)return;o.quantity=v;addFact({type:'quantity',taskId:t.id,key:r.key,at:now(),value:v,delta,unit:t.goal.unit});const reached=checkGoal(t,r.key);render();notify(reached?'Цель выполнена. Продолжение возможно по желанию.':'Количество записано с фактическим временем.')}
function addTag(){const name=$('#new-tag-name')?.value.trim();if(!name)return;let found=tags.find(t=>t.name.toLocaleLowerCase()===name.toLocaleLowerCase());if(!found){found={id:Math.max(0,...tags.map(t=>t.id))+1,name};tags.push(found)}if(state.editor.kind==='task-tags'&&!state.editor.ids.includes(found.id))state.editor.ids.push(found.id);renderEditor();render()}
function demoScenario(name){if(name==='goal')name='manualdone';closeDelta();if(state.session)flushWork('demo-switch');state.session=null;state.restoreNotice=false;state.scenario=name;state.screen='tasks';state.offline=name==='offline';state.windowHidden=false;resetDetail();if(['stopped','completed'].includes(name)){const t=task(7);state.selected=refFor(t);state.session={id:state.nextSession++,taskId:t.id,key:'once',date:TODAY,config:configFor(t),stage:'focus',paused:true,remaining:1680,focusRemaining:1680,focusElapsed:120,segmentSeconds:120,segmentStart:new Date(new Date(now()).getTime()-120000).toISOString(),lastTick:Date.now()};stopSession(name==='completed'?'complete':'stop',true);if(name==='completed')setDone(t,'once',true);state.selected=refFor(t);state.scenario=name;render();return}if(name==='manualdone'){setDone(task(6),TODAY,true,'manual');state.selected=refFor(task(6));render();return}if(name==='idle'){state.selected=state.variant==='B'?null:refFor(task(6));render();return}if(name==='offline'){state.queue=Math.max(3,state.queue);state.selected=refFor(task(6));render();return}const target=['child','parentdone'].includes(name)?2:name==='blocked'?7:6;const cfg=configFor(task(target));state.session={id:state.nextSession++,taskId:target,key:occKey(task(target)),date:TODAY,config:cfg,stage:'focus',paused:name==='pause'||name==='restore',remaining:18*60+24,focusRemaining:18*60+24,focusElapsed:0,segmentSeconds:0,segmentStart:null,lastTick:Date.now(),earlyBreak:false,interval:1,fullRecorded:false,goalReached:false};state.selected=refFor(task(name==='blocked'?6:target));state.expanded.add(1);if(name==='rest'){state.session.stage='break';state.session.remaining=3*60+12;state.session.earlyBreak=true}if(name==='parentdone')setDone(task(1),TODAY,true);if(name==='goal'){const prevQuantity=occ(task(6),TODAY).quantity;occ(task(6),TODAY).quantity=10;addFact({type:'quantity',taskId:6,key:TODAY,at:now(),value:10,delta:10-prevQuantity,unit:'страниц'});setDone(task(6),TODAY,true,'goal');state.session.stage='goal';state.session.goalReached=true;state.session.paused=true;}if(name==='restore')state.restoreNotice=true;render();if(name==='delta')openDelta($('.sessionbar .session-time'))}
function switchVariant(v){state.variant=v;state.more=null;try{const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u)}catch{}render()}
function actionRef(b){const id=Number(b.dataset.id);return {id,key:b.dataset.key||occKey(task(id),b.dataset.date||TODAY),date:b.dataset.date||TODAY}}
function doAction(action,b){switch(action){case'prev-variant':case'next-variant':{const arr=['A','B','C'],i=arr.indexOf(state.variant);switchVariant(arr[(i+(action==='next-variant'?1:2))%3]);break}case'sidebar':state.sidebar=!state.sidebar;render();break;case'compact':state.compact=!state.compact;render();break;case'hide-window':state.windowHidden=true;render();$('#notch-zone').classList.add('expanded');break;case'open-window':state.windowHidden=false;$('#notch-zone').classList.remove('expanded');render();break;case'toggle-notch':$('#notch-zone').classList.toggle('expanded');break;case'more':state.more=state.more===b.dataset.where?null:b.dataset.where;render();break;case'period':state.period=b.dataset.period;state.screen='tasks';state.more=null;state.searchGlobal=false;if(b.dataset.global==='true'){state.project=null;state.tags=[];state.search=''}resetDetail();if(state.view==='calendar'){if(state.period==='tomorrow')state.month=addDays(TODAY,1).slice(0,7);else if(['today','week','month'].includes(state.period))state.month='2026-11'}render();break;case'project':state.project=Number(b.dataset.id);state.tags=[];state.screen='tasks';state.searchGlobal=false;resetDetail();render();break;case'tag-scope':state.project=null;state.tags=[Number(b.dataset.id)];state.screen='tasks';state.searchGlobal=false;resetDetail();render();break;case'reset-tags':state.tags=[];resetDetail();render();break;case'clear-filters':state.tags=[];state.search='';state.searchGlobal=false;state.period='all';resetDetail();render();break;case'filter-tags':openEditor('filter-tags');break;case'show-done':state.showDone=!state.showDone;render();break;case'select':selectTask(actionRef(b));break;case'expand':{const id=Number(b.dataset.id);state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render();requestAnimationFrame(()=>$(`[data-action=expand][data-id="${id}"]`)?.focus({preventScroll:true}));break}case'complete':completeTask(actionRef(b));break;case'start':startSession(actionRef(b));break;case'close-detail':case'back-detail':closeDetail();break;case'view':state.view=b.dataset.view;state.screen='tasks';state.selected=null;state.dayView=null;render();break;case'tasks':state.screen='tasks';resetDetail();render();break;case'report':state.screen='report';state.reportProject=state.project;state.reportTag=state.tags[0]||null;state.selected=null;render();break;case'task-report':state.screen='report';state.reportProject=projectId(selectedTask());state.reportTag=null;state.reportMode='timeline';state.selected=null;render();break;case'report-task':selectTask(actionRef(b));break;case'settings':state.screen='settings';resetDetail();render();break;case'create':state.draft=defaultDraft();if(b.dataset.date)state.draft.day=b.dataset.date;openEditor('create');break;case'close-editor':closeEditor();break;case'editor-save':saveEditor();break;case'add-draft-child':captureDraft();state.draft.children.push({title:'',note:'',tags:[],goalTarget:'',goalUnit:'мин',custom:false,config:{...DEFAULT}});state.draft.advanced=true;renderEditor();break;case'remove-draft-child':captureDraft();state.draft.children.splice(Number(b.dataset.index),1);renderEditor();break;case'draft-tag':captureDraft();{const id=Number(b.dataset.id),ts=state.draft.tags;state.draft.tags=ts.includes(id)?ts.filter(x=>x!==id):[...ts,id];renderEditor()}break;case'discard-draft':closeEditor(true);break;case'return-draft':state.editor={kind:'create'};renderEditor();break;case'save-draft-now':state.editor={kind:'create'};renderEditor();saveCreated();break;case'pomo':case'day':case'task-project':case'repeat':case'goal-editor':case'task-tags':case'new-project':case'project-options':case'manage-tags':case'free-editor':case'queue':case'account':case'note-link':case'signup':case'recovery':openEditor(action);break;case'clear-day':$('#edit-day').value='';break;case'remove-goal':selectedTask().goal=null;closeEditor(true);render();break;case'choose-tag':{const id=Number(b.dataset.id),ed=state.editor;ed.ids=ed.ids.includes(id)?ed.ids.filter(i=>i!==id):[...ed.ids,id];renderEditor();break}case'clear-editor-tags':state.editor.ids=[];renderEditor();break;case'create-tag':addTag();break;case'profile-edit':openEditor('profile-edit',{id:Number(b.dataset.id)});break;case'profile-new':openEditor('profile-new');break;case'free-profile':startSession(null,state.profiles.find(p=>p.id===Number(b.dataset.id)));break;case'free-start':startSession(null,state.profiles.find(p=>p.id===Number($('#notch-profile').value)));break;case'start-free-editor':{const p=state.profiles.find(p=>p.id===Number($('#free-profile').value));closeEditor(true);startSession(null,p);break}case'current-close':closeEditor(true);currentTask();break;case'current':currentTask();break;case'pause':pauseSession();break;case'rest':restSession();break;case'skip-rest':if(state.cycles>=state.session.config.after)state.cycles=0;beginNextFocus();break;case'stop':stopSession();break;case'continue-goal':continueGoal();break;case'next-focus':if(state.session?.earlyBreak){state.session.stage='focus';state.session.remaining=state.session.focusRemaining;state.session.paused=false;state.session.lastTick=Date.now();render()}else beginNextFocus();break;case'open-delta':openDelta(b);break;case'repeat-delta':applyDelta(state.chosenDelta);break;case'close-delta':closeDelta();break;case'apply-delta':applyDelta(state.draftDelta);break;case'save-quantity':addQuantity($('#quantity-value').value);break;case'quantity-plus':addQuantity(occ(selectedTask(),state.selected.key).quantity+1);break;case'add-subtask':{const title=$('#subtask-title').value.trim();if(!title)return;const p=selectedTask();tasks.push({id:state.nextId++,parent:p.id,title,note:'',tags:[],config:null});state.expanded.add(p.id);render();break}case'calendar-today':state.month='2026-11';state.period='today';state.chosenDay=TODAY;render();break;case'day-list':state.chosenDay=b.dataset.date;state.dayView=b.dataset.date;state.selected=null;state.returnContext={view:'calendar',dayView:null};render();break;case'back-day':case'close-day':state.dayView=null;state.view='calendar';render();break;case'search':state.sidebar=true;render();$('#search-input').focus();break;case'search-global':state.searchGlobal=true;state.period='all';state.project=null;state.tags=[];resetDetail();render();break;case'dismiss-restore':state.restoreNotice=false;render();break;case'reset-cycle':state.cycles=0;render();notify('Счётчик полного цикла сброшен');break;case'toggle-offline':state.offline=!state.offline;renderEditor();render();break;case'retry-queue':if(state.offline){notify('Сети нет. Результаты остаются в локальной очереди.');return}if(!state.loggedIn){openEditor('account');return}state.queue=0;closeEditor(true);render();notify('Демонстрационная очередь очищена. Настоящей отправки не было.');break;case'signin':state.loggedIn=true;openEditor('import');render();break;case'skip-import':closeEditor(true);render();notify('Гостевые данные оставлены локально.');break;case'confirm-import':{const agree=$('#import-consent').checked;closeEditor(true);render();notify(agree?'Перенос показан в демо. Реального обмена нет.':'Перенос пропущен.');break}case'signout':state.loggedIn=false;closeEditor(true);render();break;case'verify-demo':openEditor('verify-demo');break;case'recovery-done':closeEditor(true);notify('Показан сценарий восстановления. Письмо не отправлялось.');break;case'save-error':state.saveError=!state.saveError;render();notify(state.saveError?'Демонстрация ошибки: текст заметки не потерян.':'Повторное сохранение в памяти выполнено.');break;case'archive-project':if(state.session?.taskId&&projectId(task(state.session.taskId))===state.project){notify('Сначала заверши активную сессию проекта.');return}openEditor('archive-confirm');break;case'confirm-archive':projects.find(p=>p.id===state.project).archived=true;state.project=null;state.period='all';closeEditor(true);resetDetail();render();notify('Проект архивирован. История сохранена.','Восстановить',()=>{projects.forEach(p=>p.archived=false);render()});break;}}
document.addEventListener('click',e=>{const variant=e.target.closest('.variantbtn[data-variant]');if(variant){switchVariant(variant.dataset.variant);return}const scenario=e.target.closest('[data-scenario]');if(scenario){demoScenario(scenario.dataset.scenario);return}const action=e.target.closest('[data-action]');if(action){e.preventDefault();doAction(action.dataset.action,action);return}const preset=e.target.closest('[data-preset]');if(preset){state.draftDelta=Number(preset.dataset.preset);renderDelta();return}const step=e.target.closest('[data-step]');if(step){state.draftDelta=Math.max(-20,Math.min(20,state.draftDelta+Number(step.dataset.step)));renderDelta();return}const setting=e.target.closest('[data-setting]');if(setting){state[setting.dataset.setting]=!state[setting.dataset.setting];render();return}const rp=e.target.closest('[data-report-period]');if(rp){state.reportPeriod=rp.dataset.reportPeriod;render();return}const rm=e.target.closest('[data-report-mode]');if(rm){state.reportMode=rm.dataset.reportMode;render();return}const month=e.target.closest('[data-month]');if(month){const d=dateObj(state.month+'-01');d.setMonth(d.getMonth()+Number(month.dataset.month));state.month=localDate(d).slice(0,7);state.period=state.month;state.selected=null;state.dayView=null;render();return}const del=e.target.closest('[data-delete-tag]');if(del){const id=Number(del.dataset.deleteTag),ix=tags.findIndex(t=>t.id===id),old=tags[ix],links=tasks.filter(t=>(t.tags||[]).includes(id)).map(t=>t.id);tags.splice(ix,1);tasks.forEach(t=>t.tags=(t.tags||[]).filter(v=>v!==id));state.tags=state.tags.filter(v=>v!==id);renderEditor();render();notify('Метка удалена. Задачи и факты сохранены.','Отменить',()=>{tags.splice(ix,0,old);links.forEach(idTask=>task(idTask).tags.push(id));render();if(state.editor?.kind==='manage-tags')renderEditor()});return}if(state.popover&&!e.target.closest('#time-popover,.adjust-time,.adjust-delta,.notch-mini-time'))closeDelta();if(state.more&&!e.target.closest('[data-more-wrap]')){state.more=null;render();}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-format]');if(b)e.preventDefault()});document.addEventListener('click',e=>{const b=e.target.closest('[data-format]');if(!b)return;$('#detail-note')?.focus();document.execCommand(b.dataset.format,false,null);if(selectedTask())selectedTask().note=cleanNote($('#detail-note').innerHTML)});
document.addEventListener('pointerover',e=>{const b=e.target.closest('.adjust-time,.adjust-delta');if(b&&!b.disabled)openDelta(b);const wrap=e.target.closest('[data-more-wrap]');if(wrap&&state.more!==wrap.dataset.moreWrap){state.more=wrap.dataset.moreWrap;render();}});
document.addEventListener('input',e=>{const n=e.target;if(n.id==='delta-range'){state.draftDelta=Number(n.value);renderDelta();return}if(n.closest('#editor-dialog')){captureDraft();return}if(n.id==='detail-title'){const t=selectedTask();if(t&&n.value.trim())t.title=n.value.trim();$$(`[data-row="${t?.id}"] .tasktitle>span:first-child`).forEach(el=>el.textContent=t.title);if(state.session?.taskId===t?.id){$$('.session-task,.notch-owner').forEach(el=>el.textContent=ownerName())}return}if(n.id==='detail-note'){const t=selectedTask();if(t)t.note=cleanNote(n.innerHTML);$('#note-save').textContent=state.saveError?'Не удалось сохранить · текст остаётся в редакторе':'Сохранено в памяти';return}if(n.id==='search-input'){const pos=n.selectionStart;state.search=n.value;resetDetail();render();const input=$('#search-input');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const n=e.target;if(n.id==='scenario-select'){demoScenario(n.value);return}if(n.id==='report-project'){state.reportProject=n.value?Number(n.value):null;render();return}if(n.id==='report-tag'){state.reportTag=n.value?Number(n.value):null;render();return}if(n.id==='pomo-source'){const src=n.value;let c=DEFAULT;if(src==='inherit')c=configFor(task(selectedTask().parent));else if(src.startsWith('profile-'))c=state.profiles.find(p=>p.id===Number(src.slice(8)));else if(src==='custom')c=configFor(selectedTask());$('#pomo-config').innerHTML=cfgFields(c);return}if(n.closest('#editor-dialog'))captureDraft();});
document.addEventListener('paste',e=>{if(e.target.closest('#detail-note')){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));selectedTask().note=cleanNote($('#detail-note').innerHTML)}});
$('#editor-dialog').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});
document.addEventListener('keydown',e=>{const editing=e.target.closest('input,textarea,select,[contenteditable=true]');if(e.key==='Escape'){if(state.popover){closeDelta();return}if($('#editor-dialog').open)return;if(state.search){state.search='';state.searchGlobal=false;render();return}if(state.selected){closeDetail();return}state.more=null;$('#notch-zone').classList.remove('expanded');render();}if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();state.sidebar=true;render();$('#search-input').focus();return}if(editing){if(e.key==='Enter'&&e.target.id==='new-title'){e.preventDefault();saveCreated()}if(e.key==='Enter'&&e.target.id==='subtask-title'){e.preventDefault();doAction('add-subtask',e.target)}return}if($('#editor-dialog').open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();doAction(e.key==='ArrowRight'?'next-variant':'prev-variant',document.body)}if(e.key==='n'){e.preventDefault();state.draft=defaultDraft();openEditor('create')}if(e.key===' '&&state.session){e.preventDefault();pauseSession()}});
let dragData=null;document.addEventListener('dragstart',e=>{const b=e.target.closest('[data-drag-id]');if(!b)return;dragData={id:Number(b.dataset.dragId),key:b.dataset.key,date:b.dataset.date};e.dataTransfer.setData('text/plain',JSON.stringify(dragData));e.dataTransfer.effectAllowed='move'});document.addEventListener('dragover',e=>{const day=e.target.closest('[data-drop-date]');if(!day||!dragData)return;e.preventDefault();day.classList.add('dragover')});document.addEventListener('dragleave',e=>e.target.closest('[data-drop-date]')?.classList.remove('dragover'));document.addEventListener('drop',e=>{const day=e.target.closest('[data-drop-date]');if(!day||!dragData)return;e.preventDefault();moveOccurrence(task(dragData.id),dragData.key,day.dataset.dropDate);dragData=null;render()});document.addEventListener('dragend',()=>{dragData=null;$$('.dragover').forEach(n=>n.classList.remove('dragover'))});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{closeDelta();render()},150)});
function init(){if(params.has('project'))state.project=Number(params.get('project'))||null;if(params.has('period'))state.period=params.get('period');state.selected=state.variant==='B'||state.variant==='C'?null:refFor(task(6));const scene=params.get('scenario');if(scene)demoScenario(scene);const sc=params.get('screen');if(sc==='calendar'){state.view='calendar';state.selected=null;state.period=params.get('period')||'month'}else if(sc==='report'){state.screen='report';state.selected=null;state.reportMode=params.get('mode')==='timeline'?'timeline':'tasks'}else if(sc==='settings'){state.screen='settings';state.selected=null}else if(sc==='day'){state.view='calendar';state.period='month';state.selected=null;state.dayView=params.get('date')||TODAY;state.chosenDay=state.dayView}else if(sc==='list'){state.screen='tasks';state.selected=null}if(params.has('task')){const t=task(params.get('task'));if(t){state.selected=refFor(t,params.get('date')||TODAY,params.get('key')||undefined);state.returnContext={screen:'tasks',view:state.view,dayView:state.dayView};state.screen='tasks'}}render();if(sc==='create'){state.draft=defaultDraft();state.draft.advanced=params.get('advanced')==='1';openEditor('create')}if(params.has('editor')&&(state.selected||['free-editor','queue','account'].includes(params.get('editor'))))openEditor(params.get('editor'));if(scene==='delta')openDelta($('.sessionbar .session-time'));}
/* LATEST_MVP_DENSITY: no quantity-goal UI or facts in the MVP fixture. */
tasks.forEach(t=>{delete t.goal});facts=facts.filter(f=>f.type!=='quantity');
let calendarResizeTimer;addEventListener('resize',()=>{clearTimeout(calendarResizeTimer);calendarResizeTimer=setTimeout(()=>{if(state.view==='calendar'&&!state.editor&&state.screen==='tasks')render()},120)});
init();setInterval(()=>{tick();updateTimes()},250);
