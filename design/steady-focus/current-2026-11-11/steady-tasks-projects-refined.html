function queueFact(record){const id=record.sessionId||record.uuid;if(!delivery.some(d=>d.id===id))delivery.push({id,status:state.offline?'retry':!state.loggedIn?'auth':'waiting',at:record.start||record.at});state.queue=delivery.filter(d=>d.status!=='sent').length;}
function addFact(f){if(f.uuid&&facts.some(x=>x.uuid===f.uuid))return facts.find(x=>x.uuid===f.uuid);const record={id:state.nextFact++,uuid:uuid(),...f};if(record.sessionId&&!record.tool)record.tool=sessions.find(x=>x.id===record.sessionId)?.tool;if(f.type==='work'&&dateOfStamp(f.start)!==dateOfStamp(f.end)){let cursor=new Date(f.start),end=new Date(f.end);const ratio=f.seconds/Math.max(.001,(end-cursor)/1000);while(cursor<end){const boundary=new Date(cursor);boundary.setHours(24,0,0,0);const stop=new Date(Math.min(boundary.getTime(),end.getTime()));facts.push({...record,id:state.nextFact++,uuid:uuid(),start:cursor.toISOString(),end:stop.toISOString(),seconds:(stop-cursor)/1000*ratio});cursor=stop}}else facts.push(record);queueFact(record);return record}

function flushWork(reason='save'){const s=state.session;if(!s)return;const seconds=s.segmentSeconds||0;if(seconds>0){const start=s.segmentStart||now();addFact({type:'work',tool:s.tool,taskId:s.taskId,key:s.key,start,end:new Date(new Date(start).getTime()+seconds*1000).toISOString(),seconds,sessionId:s.id,reason});s.segmentSeconds=0;s.segmentStart=null;}}

const timerDefaults=new Map();let activeToolMenu=null;

function openToolMenu(anchor,ref){if(activeToolMenu?.anchor===anchor){closeToolMenu();return}closeToolMenu(false);closeDelta();const el=document.createElement('div');el.className='instrument-menu';el.setAttribute('popover','manual');el.setAttribute('role','menu');el.setAttribute('aria-label','Инструменты времени');el.innerHTML=`<div class="instrument-menu-head">${ref?E(task(ref.id).title):'Без задачи'}</div>${Object.entries(TOOL_NAMES).map(([tool,label])=>{const prefs=savedToolSettings(ref,tool),cfg=prefs.config,summary=!prefs.configured?'Не задано':tool==='timer'?prefs.duration+' мин':tool==='pomodoro'?`${cfg.focus} / ${cfg.short} / ${cfg.long} мин · после ${cfg.after}`:'Счёт вверх';return `<div class="instrument-menu-row"><button class="instrument-start" role="menuitem" data-action="menu-start-tool" data-tool="${tool}" ${state.session?'disabled':''}>${icon(TOOL_ICONS[tool])}<span class="instrument-description"><strong>${label}</strong><small>${summary}</small></span>${icon('play')}</button>${tool!=='stopwatch'?`<button class="instrument-configure" role="menuitem" data-action="menu-setup-tool" data-tool="${tool}" aria-label="${label}: изменить параметры запуска" title="Изменить параметры запуска" ${state.session?'disabled':''}>${icon('settings')}</button>`:''}</div>`}).join('')}${state.session?'<div class="instrument-lock">Сначала заверши текущую сессию<button role="menuitem" data-action="menu-current">К текущей задаче →</button></div>':''}`;(anchor.closest('dialog')||document.body).append(el);activeToolMenu={el,anchor,ref};anchor.setAttribute('aria-expanded','true');try{el.showPopover()}catch{el.removeAttribute('popover')}placeToolMenu();el.querySelector('button:not(:disabled)')?.focus({preventScroll:true})}
function openSessionSettings(){const active=state.session;if(!active||active.tool==='stopwatch')return;closeToolMenu(false);closeDelta();openEditor('session-settings',{sessionId:active.id});}
function saveSessionSettings(){const ed=state.editor,active=state.session;if(!active||ed.sessionId!==active.id){closeEditor(true);notify('Эта сессия уже завершена');return}tick();if(state.session!==active){closeEditor(true);return}if(active.tool==='timer'){const value=Number($('#session-remaining').value);active.remaining=value*60;active.focusRemaining=active.remaining;}else{const next=cfgFrom($('#editor-dialog')),old=active.config,workDelta=(next.focus-old.focus)*60;active.focusRemaining=Math.max(0,active.focusRemaining+workDelta);if(active.stage==='focus')active.remaining=active.focusRemaining;else if(active.stage==='break')active.remaining=Math.max(0,active.remaining+(next[active.longBreak?'long':'short']-old[active.longBreak?'long':'short'])*60);active.config={...next};}const meta=sessions.find(x=>x.id===active.id);if(meta)meta.config={...active.config};closeEditor(true);if(active.remaining<=0&&active.stage==='focus'){finishSession('manualzero',true);notify('Остаток сокращён до нуля. Сохранено фактическое время.');return}render();notify('Изменено только для текущей сессии. Следующие запуски — с прежними настройками.');}
function startSession(r=null,profile=null,tool='pomodoro',duration=null){if(state.session){notify('Сначала заверши текущую сессию','К текущей задаче',currentTask);return}const t=r&&task(r.id),cfg={...(profile||(t?configFor(t):state.profiles[0]))},id=uuid();const initial=tool==='stopwatch'?null:(duration||cfg.focus)*60;state.session={id,tool,taskId:t?.id||null,key:r?.key||null,date:r?.date||TODAY,config:cfg,stage:'focus',paused:false,remaining:initial,focusRemaining:initial,focusElapsed:0,segmentSeconds:0,segmentStart:null,breakSeconds:0,breakStart:null,pauseStart:null,lastTick:Date.now(),earlyBreak:false,interval:1,fullRecorded:false};sessions.push({id,tool,taskId:t?.id||null,key:r?.key||null,date:r?.date||TODAY,startedAt:now(),endedAt:null,reason:null,config:{...cfg}});state.scenario=tool;closeDelta();render();notify(toolName(tool)+' · '+ownerName())}

function pauseSession(){const s=state.session;if(!s)return;tick();if(state.session!==s||!['focus','break'].includes(s.stage))return;if(!s.paused){if(s.stage==='focus')flushWork('pause');else finishNonwork();s.paused=true;s.pauseStart=now();}else{finishNonwork();s.paused=false;s.lastTick=Date.now();}render()}
function startBreak(){const s=state.session;if(!s||s.tool!=='pomodoro')return;finishNonwork();s.longBreak=state.cycles>=s.config.after;s.stage='break';s.remaining=(s.longBreak?s.config.long:s.config.short)*60;s.breakSeconds=0;s.breakStart=null;s.paused=false;s.lastTick=Date.now();}

function completeTask(r){const t=task(r.id),o=occ(t,r.key);if(o.done){setDone(t,r.key,false);render();notify('Задача возвращена в работу. История сохранена.');return}if(state.session?.taskId===t.id&&state.session.key===r.key)stopSession('complete',true);setDone(t,r.key,true);render();notify(state.session&&task(state.session.taskId)?.parent===t.id?'Родитель выполнен. Сессия подзадачи продолжается.':'Выполнено. Отметка сохранена без добавления времени.')}
function naturalEnd(){const s=state.session;if(!s)return;if(s.stage==='focus'){s.focusRemaining=0;flushWork('natural');if(s.tool==='timer'){finishSession('natural',true);notify('Таймер завершён. Фактическое время сохранено; выполнение задачи — отдельно.');return}if(s.tool!=='pomodoro')return;if(!s.fullRecorded){addFact({uuid:s.id+'-full-'+s.interval,type:'full',tool:'pomodoro',taskId:s.taskId,key:s.key,at:now(),sessionId:s.id,interval:s.interval});s.fullRecorded=true;state.cycles++;}s.stage='waitBreak';s.paused=false;if(state.autoBreak)startBreak();}else if(s.stage==='break'){finishNonwork();if(s.longBreak)state.cycles=0;s.stage='waitFocus';s.paused=false;if(state.autoNext&&!(s.taskId&&done(task(s.taskId),s.key))){if(s.earlyBreak){s.stage='focus';s.remaining=s.focusRemaining;s.lastTick=Date.now()}else beginNextFocus();}}closeDelta();render();notify('Интервал завершён · фактическое время сохранено')}
function tick(){const s=state.session;if(!s)return;const n=Date.now(),dt=Math.max(0,(n-s.lastTick)/1000);s.lastTick=n;if(s.paused||!['focus','break'].includes(s.stage))return;if(dt>10){flushWork('sleep');finishNonwork();s.paused=true;s.pauseStart=now();state.restoreNotice=true;render();return}const used=s.tool==='stopwatch'?dt:Math.min(s.remaining,dt);if(s.stage==='focus'){if(!s.segmentStart)s.segmentStart=new Date(new Date(now()).getTime()-used*1000).toISOString();s.segmentSeconds+=used;s.focusElapsed+=used;if(s.tool!=='stopwatch')s.focusRemaining=Math.max(0,s.remaining-used);}else{if(!s.breakStart)s.breakStart=new Date(new Date(now()).getTime()-used*1000).toISOString();s.breakSeconds+=used;}if(s.tool!=='stopwatch'){s.remaining=Math.max(0,s.remaining-used);if(s.remaining<=0)naturalEnd();}}

function cfgFields(c,prefix='',inherit=false){return `<div class="number-config" data-number-config>${[['focus','Работа',1,180],['short','Короткий отдых',1,60],['long','Длинный отдых',1,120],['after','Длинный отдых после',1,12]].map(([k,label,min,max])=>`<input type="number" min="${min}" max="${max}" name="${prefix+k}" value="${c[k]}" data-number-key="${k}" aria-label="${label}" ${inherit?'disabled':''}>`).join('')}</div>`}
function cfgFrom(root,prefix=''){const out={};for(const [k,min,max]of[['focus',1,180],['short',1,60],['long',1,120],['after',1,12]]){const v=Number(root.querySelector(`[name="${prefix+k}"]`)?.value);out[k]=Math.min(max,Math.max(min,Number.isFinite(v)&&v?v:DEFAULT[k]));}return out}
function repeatOptions(value){const selected=value==='monthly'?'monthdays':value;const groups=[['Основные',[['none','Не повторять'],['daily','Каждый день'],['days','Дни в неделе'],['monthdays','Дни в месяце']]],['Быстрый выбор',[['weekdays','По будням'],['weekends','По выходным']]],['Другие правила',[['interval','Через интервал'],['weekly','Раз в неделю · любой день'],['monthlast','Последний день месяца'],['period','Каждый день в течение периода']]]];return groups.map(([name,items])=>`<optgroup label="${name}">${items.map(([v,n])=>`<option value="${v}" ${selected===v?'selected':''}>${n}</option>`).join('')}</optgroup>`).join('')}

function validateRepeat(root){if(!root)return true;const data=readRepeatUI(root);let message='';if(data.repeat!=='none'&&!data.day)message='Выбери дату начала.';if(data.repeat==='monthdays'&&!data.monthDays.length)message='Выбери хотя бы одно число месяца.';if(data.repeat==='days'&&!data.days.length)message='Выбери хотя бы один день недели.';if(data.repeat==='period'&&(!data.repeatStart||!data.repeatEnd||data.repeatEnd<data.repeatStart))message='Укажи начало и конец периода. Конец должен быть не раньше начала.';if(data.repeat==='interval'&&(!Number($('[name=every]',root).value)||Number($('[name=every]',root).value)<1||Number($('[name=every]',root).value)>365))message='Интервал — от 1 до 365 дней или недель.';const error=$('#repeat-error',root);error.textContent=message;error.hidden=!message;if(message){const details=root.closest('details');if(details)details.open=true;error.scrollIntoView({block:'nearest'});}return !message;}

function openCreationProperty(kind,anchor){captureDraft();if(creationPropertyPanel?.kind===kind){if(['timer','pomodoro'].includes(kind))closeCreationProperty();else finishCreationProperty();return}closeCreationProperty(false);closeNumberPopup(false);const el=document.createElement('section');el.className='creation-property-popover';el.setAttribute('popover','manual');el.setAttribute('role','dialog');const label={day:'День',project:'Проект',tags:'Метки',repeat:'Расписание',schedule:'Расписание',priority:'Приоритет',timer:'Таймер',pomodoro:'Помодоро'}[kind];el.setAttribute('aria-label',label);el.innerHTML=`<header class="creation-property-head"><h3>${label}</h3><button class="iconbtn" data-action="${['timer','pomodoro'].includes(kind)?'creation-tool-cancel':'creation-property-done'}" aria-label="Закрыть выбор">${icon('close')}</button></header>${creationPropertyBody(kind)}${kind==='priority'?'':`<footer class="creation-property-foot">${['timer','pomodoro'].includes(kind)?`<button class="btn quiet" data-action="creation-tool-cancel">Отмена</button>${(kind==='timer'?state.draft.timer:state.draft.custom)?'<button class="textbtn" data-action="creation-tool-clear">Сбросить</button>':''}`:''}<button class="btn primary" data-action="creation-property-done">Готово</button></footer>`}`;$('#editor-dialog').append(el);creationPropertyPanel={el,anchor,kind};anchor.setAttribute('aria-expanded','true');if(kind==='repeat'||kind==='schedule')refreshRepeatUI($('.repeat-editor',el));if(kind==='pomodoro'){el.classList.add('creation-pomodoro-popover');$('[data-number-config]',el).dataset.numberInline='true'}enhanceNumberPickers(el);try{el.showPopover()}catch{el.removeAttribute('popover')}placeCreationProperty();el.querySelector('select,input:not([type=hidden]),button')?.focus({preventScroll:true});}
function finishCreationProperty(){if(!creationPropertyPanel)return;if(creationPropertyPanel.kind==='timer')state.draft.timer=Math.max(1,Math.min(240,Number($('#creation-tool-timer',creationPropertyPanel.el).value)||25));if(creationPropertyPanel.kind==='pomodoro'){state.draft.config=cfgFrom(creationPropertyPanel.el);state.draft.custom=true;}if(['repeat','schedule'].includes(creationPropertyPanel.kind)&&!validateRepeat($('.repeat-editor',creationPropertyPanel.el)))return;const kind=creationPropertyPanel.kind;captureCreationProperty();closeCreationProperty(false);renderEditor();$(`[data-action=creation-property][data-property="${kind}"]`)?.focus({preventScroll:true});}
function validateCreationSchedule(){const d=state.draft;const invalid=d.repeat==='days'&&!d.days?.length||d.repeat==='monthdays'&&!d.monthDays?.length||d.repeat==='period'&&(!d.repeatStart||!d.repeatEnd||d.repeatEnd<d.repeatStart);if(invalid){openCreationProperty('schedule',$('[data-action=creation-property][data-property=schedule]'));validateRepeat($('.repeat-editor',creationPropertyPanel.el));return false}return true}
function openCreationNoteLink(){const selection=getSelection(),note=$('#creation-note');creationLinkRange=selection?.rangeCount&&note.contains(selection.anchorNode)?selection.getRangeAt(0).cloneRange():null;const dialog=$('#creation-link-dialog');dialog.innerHTML=`<div class="dialoghead"><h2>Ссылка в заметке</h2><button class="iconbtn" data-action="creation-link-cancel" aria-label="Закрыть">${icon('close')}</button></div><label class="field">Текст ссылки<input id="creation-link-label"></label><label class="field">Адрес<input id="creation-link-url" type="url" placeholder="https://…"></label><p class="error" id="creation-link-error" hidden>Укажи адрес, начинающийся с https:// или http://</p><footer class="dialogfoot"><button class="btn quiet" data-action="creation-link-cancel">Отмена</button><button class="btn primary" data-action="creation-link-save">Вставить</button></footer>`;dialog.showModal();$('#creation-link-url').focus();}
function saveCreationNoteLink(){const href=$('#creation-link-url').value.trim(),label=$('#creation-link-label').value.trim()||href;if(!/^https?:\/\//i.test(href)){$('#creation-link-error').hidden=false;return}const note=$('#creation-note'),a=document.createElement('a');a.href=href;a.textContent=label;a.target='_blank';a.rel='noopener';if(creationLinkRange){creationLinkRange.deleteContents();creationLinkRange.insertNode(a)}else note.append(a);captureDraft();$('#creation-link-dialog').close();note.focus({preventScroll:true});}
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-creation-format]'))e.preventDefault();if(creationPropertyPanel&&!numberPopup&&!e.target.closest('.creation-property-popover,[data-action=creation-property]')){captureCreationProperty();closeCreationProperty(false);requestAnimationFrame(()=>{if(state.editor?.kind==='create'&&!creationPropertyPanel)updateCreationPropertyLabels()});}},true);
function updateCreationPropertyLabels(){if(!state.draft)return;const d=state.draft,values={timer:d.timer?d.timer+' мин':'Не задано',pomodoro:d.custom?`${d.config.focus} / ${d.config.short} / ${d.config.long} мин`:'Не задано',schedule:scheduleLabel(d),day:d.repeat==='none'?(d.day?fmtDay(d.day):'Без даты'):fmtDay(draftStartDate(d)),project:projectName(d.project),tags:d.tags.length?d.tags.map(tagName).join(', '):'Добавить',repeat:repeatName({...d,id:0}),priority:taskPriority(d).label};$$('[data-action=creation-property]').forEach(button=>{const span=$('span',button);if(span)span.textContent=values[button.dataset.property];if(['timer','pomodoro'].includes(button.dataset.property))button.classList.toggle('is-unset',button.dataset.property==='timer'?!d.timer:!d.custom);if(button.dataset.property==='day'){const label=button.previousElementSibling;if(label)label.textContent=d.repeat==='none'?'Запланировано на':'Начиная с'}})}
document.addEventListener('click',e=>{const button=e.target.closest('[data-creation-format]');if(!button)return;$('#creation-note').focus();document.execCommand(button.dataset.creationFormat,false,null);captureDraft();});
document.addEventListener('paste',e=>{if(e.target.closest('#creation-note')){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));captureDraft();}});
document.addEventListener('keydown',e=>{if(creationPropertyPanel&&e.key==='Escape'&&!numberPopup){e.preventDefault();e.stopImmediatePropagation();if(['timer','pomodoro'].includes(creationPropertyPanel.kind))closeCreationProperty();else finishCreationProperty();}},true);
addEventListener('resize',placeCreationProperty);document.addEventListener('scroll',e=>{if(creationPropertyPanel&&!e.target.closest?.('.creation-property-popover'))placeCreationProperty()},true);

init();setInterval(()=>{tick();updateTimes()},250);
</script></body></html>
